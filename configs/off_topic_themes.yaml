# Off-topic theme pool for the `off_topic` error type (Script 2).
#
# English only. Each dialogue draws ONE theme (seed-based). For k>1 the same
# theme is continued with a NEW aspect per injection (no repetition).
#
# Zero overlap with von Recum et al.'s UNRELATED_TOPICS (rllm_robustness/
# constants.py, 100 entries) -- neither literal nor regional/epochal. Their pool
# is science / ancient-civilisation / fine-art / tech heavy; this pool is
# deliberately built from food, everyday life, regional culture, sport, craft
# and landscape themes to stay disjoint. Do NOT add: tea, chess, Japanese tea
# ceremony, the Silk Road, Viking longships, the Great Wall, Chinese
# calligraphy, the printing press, jazz, astrophotography, or any Recum entry.
#
# Themes must have NO connection to mathematics (no numbers, formulas,
# calculations, or quantitative claims): off_topic measures whether the model
# can ignore irrelevant material in its own trace and return to the problem.

